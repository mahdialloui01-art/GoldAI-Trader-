name: GoldAI historical engine backtest
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/backtest_goldai_engine.py"
      - ".github/workflows/goldai-historical-backtest.yml"
      - "xauusd-m1-bid-2026-05-01-2026-08-01.csv"
      - "xauusd-m1-ask-2026-05-01-2026-08-01.csv"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository and LFS market data
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify BID/ASK data
        run: python tools/inspect_market_data.py
      - name: Replay production GoldAI engine
        env:
          PYTHONPATH: backend
          BACKTEST_SLIPPAGE_POINTS: "2"
        run: python tools/backtest_goldai_engine.py
      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldai-historical-backtest
          path: |
            backtest-results/
            data-inspection.json
          if-no-files-found: error
          retention-days: 30

# Re-run historical validation against the repository's paired BID/ASK archive.
