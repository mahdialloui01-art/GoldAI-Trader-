name: Fetch COMEX GC research data
run-name: GoldAI FinzData 90-day COMEX collection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-comex-gc.yml'

permissions:
  contents: read

jobs:
  fetch-comex-gc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GoldAI Trader
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install collector dependencies
        run: python -m pip install --upgrade pip pandas finzdata

      - name: Fetch up to 90 days of COMEX GC daily bars
        env:
          FINZDATA_API_KEY: ${{ secrets.FINZDATA_API_KEY }}
        run: python tools/fetch_free_comex_gc.py --days 90

      - name: Upload raw data and coverage metadata
        uses: actions/upload-artifact@v4
        with:
          name: GoldAI-COMEX-GC-90d
          path: |
            data/orderflow/comex_gc_daily_free.csv
            data/orderflow/comex_gc_daily_free.meta.json
          if-no-files-found: error
          retention-days: 14
